<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>

    
</head>

<body>

    <div class="container">

        <h1>Cadastro de Produtos</h1>

        <form id="formProduto">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite o nome do produto">

            <label for="preco">Preço:</label>
            <input type="number" id="preco" placeholder="Digite o preço" step="0.01">

            <label for="categoria">Categoria:</label>
            <select id="categoria">
                <option value="">Selecione uma categoria</option>
                <option value="Eletrônicos">Eletrônicos</option>
                <option value="Alimentos">Alimentos</option>
                <option value="Roupas">Roupas</option>
                <option value="Outros">Outros</option>
            </select>

            <label for="desconto">Desconto (%):</label>
            <input type="number" id="desconto" placeholder="Digite o desconto" min="0" max="100">

            <button type="submit">Cadastrar</button>

        </form>

        <h2>Produtos cadastrados</h2>

        <div id="listaProdutos"></div>

    </div>

    <script src="atividade2.js"></script>

</body>
</html>
